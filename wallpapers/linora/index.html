<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linora Rain</title>
<style>
  html, body { margin: 0; height: 100%; background: #e9ebee; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  // Animated wallpaper: rain falls behind the subject (masked to the sky via
  // bgmask.png), water drops slide down her face and drip off, armor lights pulse.
  // All scene coordinates are in source-image pixels (1024 x 1536).
  const IW = 1024, IH = 1536;
  const params = new URLSearchParams(location.search);
  const CAPTURE = params.has('capture');

  // Deterministic RNG so rendered video loops are reproducible.
  let seed = 1337;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const rr = (a, b) => a + rnd() * (b - a);

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const load = src => new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = src; });
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

  let img, bgmask, glow, glowBlur;
  let W = 0, H = 0, dpr = 1, view, base, rainMask, rainLayer, bokehSprite;

  // ---------- layout ----------
  function computeView() {
    const aspect = W / H;
    let s, ox, oy;
    if (aspect < 1) {
      // Portrait (phones): cover, keeping her face and the title in frame.
      s = Math.max(W / IW, H / IH);
      ox = Math.min(0, Math.max(W - IW * s, W / 2 - 650 * s));
      oy = Math.min(0, Math.max(H - IH * s, H / 2 - 780 * s));
    } else {
      // Landscape (desktops): face + title fill the height, fog extends to the sides.
      s = H / 1110;
      oy = -230 * s;
      ox = (W - IW * s) * 0.35;
      if (IW * s >= W) { s = W / IW; ox = 0; oy = Math.min(0, H / 2 - 760 * s); }
    }
    return { s, ox, oy, w: IW * s, h: IH * s };
  }
  const sx = x => view.ox + x * view.s;
  const sy = y => view.oy + y * view.s;

  function featherGrad(c, inverse) {
    const F = Math.min(140 * dpr, view.w * 0.15);
    const g = c.createLinearGradient(view.ox, 0, view.ox + view.w, 0);
    const a = inverse ? 1 : 0, b = inverse ? 0 : 1;
    const leftEdge = view.ox > 0.5, rightEdge = view.ox + view.w < W - 0.5;
    g.addColorStop(0, `rgba(0,0,0,${leftEdge ? a : b})`);
    g.addColorStop(F / view.w, `rgba(0,0,0,${b})`);
    g.addColorStop(1 - F / view.w, `rgba(0,0,0,${b})`);
    g.addColorStop(1, `rgba(0,0,0,${rightEdge ? a : b})`);
    return g;
  }

  function resize() {
    dpr = CAPTURE ? 1 : Math.min(window.devicePixelRatio || 1, 2);
    const cw = CAPTURE ? +params.get('w') || innerWidth : innerWidth;
    const ch = CAPTURE ? +params.get('h') || innerHeight : innerHeight;
    W = canvas.width = Math.round(cw * dpr);
    H = canvas.height = Math.round(ch * dpr);
    if (CAPTURE) { canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px'; }
    view = computeView();

    // Static base: blurred backdrop + sharp poster feathered into it.
    base = mk(W, H);
    const b = base.getContext('2d');
    // Stretch the poster's outer columns/rows outward so the fill continues its edges.
    // Fill the sides with a blurred mirror of the poster's edges so it continues naturally.
    b.filter = `blur(${Math.round(28 * dpr)}px) brightness(1.03)`;
    const lw = view.ox + 60 * dpr, rw = W - view.ox - view.w + 60 * dpr;
    if (lw > 60 * dpr) { b.save(); b.translate(view.ox, 0); b.scale(-1, 1); b.drawImage(img, 0, 0, lw / view.s, IH, 0, view.oy, lw, view.h); b.restore(); }
    if (rw > 60 * dpr) { b.save(); b.translate(view.ox + view.w, 0); b.scale(-1, 1); const fw = Math.min(rw / view.s, 70); b.drawImage(img, IW - fw, 0, fw, IH, -rw, view.oy, rw, view.h); b.restore(); }
    b.filter = 'none';
    const sharp = mk(W, H), sc = sharp.getContext('2d');
    sc.drawImage(img, view.ox, view.oy, view.w, view.h);
    sc.globalCompositeOperation = 'destination-in';
    sc.fillStyle = featherGrad(sc, false); sc.fillRect(0, 0, W, H);
    b.drawImage(sharp, 0, 0);

    // Rain mask: sky inside the poster, everything outside it.
    rainMask = mk(W, H);
    const m = rainMask.getContext('2d');
    m.drawImage(bgmask, view.ox, view.oy, view.w, view.h);
    m.globalCompositeOperation = 'destination-in';
    m.fillStyle = featherGrad(m, false); m.fillRect(0, 0, W, H);
    m.globalCompositeOperation = 'destination-over';
    m.fillStyle = featherGrad(m, true); m.fillRect(0, 0, W, H);
    m.fillRect(0, 0, W, view.oy); m.fillRect(0, view.oy + view.h, W, H);

    rainLayer = mk(W, H);
    initRain();
  }

  // ---------- background rain ----------
  let streaks = [], bokeh = [], front = [];
  const WIND = -0.12; // horizontal drift per unit of fall
  function newStreak(layer, anywhere) {
    const depth = [0.45, 0.75, 1.0][layer];
    return {
      x: rr(-0.1, 1.1) * W, y: anywhere ? rr(-0.1, 1) * H : rr(-0.3, -0.02) * H,
      v: (900 + rnd() * 500) * depth * dpr, len: (14 + rnd() * 26) * depth * dpr,
      w: (0.6 + layer * 0.45) * dpr, a: [0.2, 0.3, 0.42][layer] * rr(0.6, 1), layer,
    };
  }
  function initRain() {
    const area = (W * H) / (dpr * dpr) / (1920 * 1080);
    const n = Math.round(360 * Math.max(0.5, area));
    streaks = Array.from({ length: n }, (_, i) => newStreak(i % 3, true));
    bokeh = Array.from({ length: Math.round(22 * Math.max(0.6, area)) }, () => newBokeh(true));
    front = Array.from({ length: Math.round(26 * Math.max(0.5, area)) }, () => newFront(true));
    bokehSprite = mk(64, 64);
    const g = bokehSprite.getContext('2d'), rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    rg.addColorStop(0, 'rgba(90,96,108,0.55)'); rg.addColorStop(0.55, 'rgba(90,96,108,0.35)'); rg.addColorStop(1, 'rgba(90,96,108,0)');
    g.fillStyle = rg; g.fillRect(0, 0, 64, 64);
  }
  function newBokeh(anywhere) {
    return { x: rr(0, W), y: anywhere ? rr(0, H) : -40 * dpr, r: rr(6, 22) * dpr, v: rr(25, 70) * dpr, a: rr(0.25, 0.7), ph: rr(0, 6.28) };
  }
  function newFront(anywhere) {
    return { x: rr(-0.1, 1.1) * W, y: anywhere ? rr(-0.2, 1) * H : rr(-0.4, -0.1) * H, v: rr(1700, 2300) * dpr, len: rr(60, 120) * dpr, w: rr(1.2, 2.2) * dpr, a: rr(0.06, 0.13) };
  }
  function stepRain(dt) {
    for (const s of streaks) { s.y += s.v * dt; s.x += s.v * WIND * dt; if (s.y - s.len > H) Object.assign(s, newStreak(s.layer, false)); }
    for (const b of bokeh) { b.y += b.v * dt; b.x += b.v * WIND * 0.5 * dt; b.ph += dt; if (b.y - b.r > H) Object.assign(b, newBokeh(false)); }
    for (const f of front) { f.y += f.v * dt; f.x += f.v * WIND * dt; if (f.y - f.len > H) Object.assign(f, newFront(false)); }
  }
  function drawRain() {
    const r = rainLayer.getContext('2d');
    r.globalCompositeOperation = 'source-over';
    r.clearRect(0, 0, W, H);
    for (const b of bokeh) {
      r.globalAlpha = b.a * (0.75 + 0.25 * Math.sin(b.ph * 1.3));
      r.drawImage(bokehSprite, b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }
    r.globalAlpha = 1; r.lineCap = 'round';
    for (let layer = 0; layer < 3; layer++) {
      r.lineWidth = (0.6 + layer * 0.45) * dpr;
      r.beginPath();
      for (const s of streaks) if (s.layer === layer) { r.moveTo(s.x, s.y); r.lineTo(s.x - s.len * WIND, s.y - s.len); }
      r.strokeStyle = `rgba(105,115,132,${[0.2, 0.3, 0.42][layer]})`;
      r.stroke();
    }
    r.globalCompositeOperation = 'destination-in';
    r.drawImage(rainMask, 0, 0);
    ctx.drawImage(rainLayer, 0, 0);
  }
  function drawFront() {
    ctx.lineCap = 'round';
    for (const f of front) {
      ctx.strokeStyle = `rgba(225,232,245,${f.a})`; ctx.lineWidth = f.w;
      ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x - f.len * WIND, f.y - f.len); ctx.stroke();
    }
  }

  // ---------- face drops ----------
  // Polylines in image pixels; `end`: 'fall' drips off, 'fade' soaks into the skin.
  const PATHS = [
    { pts: [[800,440],[790,480],[775,520],[760,560],[745,600],[732,630],[722,660],[714,690]], end: 'fade', every: [3, 6] },
    { pts: [[700,430],[695,480],[688,540],[680,600],[672,660],[662,720],[650,780],[632,830],[612,868],[596,896]], end: 'fall', every: [4, 7] },
    { pts: [[612,560],[604,630],[594,700],[582,770],[567,830],[552,870],[541,896]], end: 'fall', every: [3.5, 6.5] },
    { pts: [[862,520],[878,560],[895,600],[907,632],[912,652]], end: 'fall', every: [6, 10] },
  ].map(p => {
    let len = 0; const cum = [0];
    for (let i = 1; i < p.pts.length; i++) { len += Math.hypot(p.pts[i][0] - p.pts[i-1][0], p.pts[i][1] - p.pts[i-1][1]); cum.push(len); }
    return { ...p, len, cum, timer: rr(0.3, 2.5) };
  });
  function along(p, d) {
    let i = 1; while (i < p.cum.length - 1 && p.cum[i] < d) i++;
    const t = (d - p.cum[i-1]) / (p.cum[i] - p.cum[i-1] || 1), a = p.pts[i-1], b = p.pts[i];
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, Math.atan2(b[1] - a[1], b[0] - a[0])];
  }

  let drops = [];
  const trails = []; // {x, y, r, age}
  function spawnDrop(p) {
    drops.push({ p, d: 0, r: rr(3.6, 5.4), state: 'slide', pause: rr(0.2, 0.6), run: 0, speed: 0, x: p.pts[0][0], y: p.pts[0][1], ang: Math.PI / 2, vy: 0, life: 1, hang: 0, grow: 0, wob: rr(0, 6.28) });
  }
  function stepDrops(dt) {
    for (const p of PATHS) {
      p.timer -= dt;
      if (p.timer <= 0) { if (drops.filter(d => d.p === p).length < 2) spawnDrop(p); p.timer = rr(...p.every); }
    }
    for (const d of drops) {
      d.wob += dt * 3;
      if (d.state === 'slide') {
        // Stick-slip motion: drops pause, then lurch forward like real water on skin.
        if (d.pause > 0) { d.pause -= dt; d.r += dt * 0.25; }
        else {
          d.speed = Math.min(d.speed + 260 * dt, 150);
          const step = d.speed * dt; d.d += step; d.run -= step;
          if (d.run <= 0) { d.pause = rr(0.15, 1.1); d.run = rr(25, 90); d.speed = rr(10, 40); }
          d.r = Math.max(2.6, d.r - step * 0.004);
          trails.push({ x: d.x, y: d.y, r: d.r, age: 0 });
        }
        if (d.d >= d.p.len) { d.d = d.p.len; d.state = d.p.end === 'fall' ? 'hang' : 'fade'; d.hang = rr(0.6, 1.6); }
        [d.x, d.y, d.ang] = along(d.p, d.d);
      } else if (d.state === 'hang') {
        d.hang -= dt; d.grow = Math.min(1, d.grow + dt * 0.8);
        if (d.hang <= 0) { d.state = 'fall'; d.vy = 30; }
      } else if (d.state === 'fall') {
        d.vy += 1400 * dt; d.y += d.vy * dt; d.ang = Math.PI / 2;
        if (d.y > 1250) d.life -= dt * 4;
      } else if (d.state === 'fade') {
        d.life -= dt * 0.7; d.r *= 1 - dt * 0.3;
      }
    }
    drops = drops.filter(d => d.life > 0 && d.y < 1700);
    for (const t of trails) t.age += dt;
    while (trails.length && trails[0].age > 2.2) trails.shift();
  }
  function drawDrops() {
    const s = view.s;
    // Wet trails left behind on the skin.
    for (const t of trails) {
      const a = 0.16 * (1 - t.age / 2.2);
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.beginPath(); ctx.arc(sx(t.x), sy(t.y), t.r * 0.45 * s, 0, 6.283); ctx.fill();
    }
    for (const d of drops) {
      const swell = 1 + d.grow * 0.45;
      const stretch = d.state === 'fall' ? 1 + Math.min(1.6, d.vy / 600) : (d.state === 'hang' ? 1 + d.grow * 0.35 : 1.18);
      const r = d.r * swell * s, x = sx(d.x), y = sy(d.y);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, d.life));
      ctx.translate(x, y); ctx.rotate(d.ang - Math.PI / 2);
      ctx.scale(1 + Math.sin(d.wob) * 0.04, stretch);
      ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.clip();
      // Refraction: a drop acts as a tiny inverted lens over what's behind it.
      ctx.save(); ctx.scale(-1, -1);
      const k = 3.2;
      ctx.drawImage(img, d.x - d.r * k, d.y - d.r * k, d.r * k * 2, d.r * k * 2, -r * 1.05, -r * 1.05, r * 2.1, r * 2.1);
      ctx.restore();
      const sh = ctx.createRadialGradient(-r * 0.25, -r * 0.3, r * 0.1, 0, 0, r);
      sh.addColorStop(0, 'rgba(255,255,255,0.05)'); sh.addColorStop(0.7, 'rgba(40,40,50,0.08)'); sh.addColorStop(1, 'rgba(20,20,30,0.45)');
      ctx.fillStyle = sh; ctx.fillRect(-r, -r, r * 2, r * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.4, r * 0.28, r * 0.18, -0.6, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.ellipse(r * 0.2, r * 0.55, r * 0.35, r * 0.12, 0, 0, 6.283); ctx.fill();
      ctx.restore();
    }
  }

  // ---------- glints & glow ----------
  const GLINTS = [[783,620],[742,615],[565,895],[600,900],[715,355],[690,640],[828,465],[540,930]].map(([x, y]) => ({ x, y, t: rr(0, 6), period: rr(4, 9) }));
  function drawGlints(time) {
    for (const g of GLINTS) {
      const ph = ((time + g.t) % g.period) / 0.6;
      if (ph > 1) continue;
      const a = Math.sin(ph * Math.PI), x = sx(g.x), y = sy(g.y), L = 9 * view.s * (0.5 + a);
      ctx.strokeStyle = `rgba(255,255,255,${0.85 * a})`; ctx.lineWidth = Math.max(1, view.s);
      ctx.beginPath(); ctx.moveTo(x - L, y); ctx.lineTo(x + L, y); ctx.moveTo(x, y - L); ctx.lineTo(x, y + L); ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(x, y, 1.6 * view.s, 0, 6.283); ctx.fill();
    }
  }
  function drawGlow(time) {
    const pulse = 0.5 + 0.5 * Math.sin(time * 1.6) * Math.sin(time * 0.37 + 1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.25 + 0.45 * pulse;
    ctx.drawImage(glowBlur, view.ox, view.oy, view.w, view.h);
    ctx.globalAlpha = 0.15 + 0.3 * pulse;
    ctx.drawImage(glow, view.ox, view.oy, view.w, view.h);
    ctx.restore();
  }

  // ---------- loop ----------
  let time = 0;
  function step(dt) { time += dt; stepRain(dt); stepDrops(dt); }
  function draw() {
    ctx.drawImage(base, 0, 0);
    drawRain();
    drawGlow(time);
    drawDrops();
    drawGlints(time);
    drawFront();
  }

  Promise.all([load('src.png'), load('bgmask.png'), load('glow.png')]).then(([a, b, c]) => {
    img = a; bgmask = b; glow = c;
    glowBlur = mk(IW, IH);
    const g = glowBlur.getContext('2d'); g.filter = 'blur(10px)'; g.drawImage(glow, 0, 0); g.drawImage(glow, 0, 0);
    resize();
    for (let i = 0; i < 90; i++) step(1 / 30); // warm up so drops are already on her face
    if (CAPTURE) { window.wp = { step, draw, canvas }; draw(); window.wpReady = true; return; }
    addEventListener('resize', resize);
    let last = performance.now();
    const frame = now => {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      step(dt); draw(); requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
