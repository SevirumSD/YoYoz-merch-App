<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linora Rain</title>
<style>
  html, body { margin: 0; height: 100%; background: #e9ebee; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  // Animated wallpaper: rain falls behind the subject (masked to the sky via
  // bgmask.png), the poster's own drips swell, slide and fall, runoff streams
  // down her face, armor and hair and pours off their edges, her hair sways in the
  // wind, armor lights pulse.
  // All scene coordinates are in source-image pixels (1024 x 1536).
  const IW = 1024, IH = 1536;
  const params = new URLSearchParams(location.search);
  const CAPTURE = params.has('capture');
  // ?water=light: the calmer first version of the water (runoff on her face and the
  // poster's own drips only). The default is the downpour over face, armor and hair.
  const LIGHT = params.get('water') === 'light';

  // Deterministic RNG so rendered video loops are reproducible.
  let seed = 1337;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const rr = (a, b) => a + rnd() * (b - a);

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const load = src => new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = src; });
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

  let img, bgmask, glow, glowBlur;
  let W = 0, H = 0, dpr = 1, view, base, rainMask, rainLayer, hairLayer, bokehSprite;

  // ---------- layout ----------
  function computeView() {
    const aspect = W / H;
    let s, ox, oy;
    if (aspect < 1) {
      // Portrait (phones): cover, keeping her face and the title in frame.
      s = Math.max(W / IW, H / IH);
      ox = Math.min(0, Math.max(W - IW * s, W / 2 - 650 * s));
      oy = Math.min(0, Math.max(H - IH * s, H / 2 - 780 * s));
    } else {
      // Landscape (desktops): face + title fill the height, fog extends to the sides.
      s = H / 1110;
      oy = -230 * s;
      ox = (W - IW * s) * 0.35;
      if (IW * s >= W) { s = W / IW; ox = 0; oy = Math.min(0, H / 2 - 760 * s); }
    }
    return { s, ox, oy, w: IW * s, h: IH * s };
  }
  const sx = x => view.ox + x * view.s;
  const sy = y => view.oy + y * view.s;

  function featherGrad(c, inverse) {
    const F = Math.min(140 * dpr, view.w * 0.15);
    const g = c.createLinearGradient(view.ox, 0, view.ox + view.w, 0);
    const a = inverse ? 1 : 0, b = inverse ? 0 : 1;
    const leftEdge = view.ox > 0.5, rightEdge = view.ox + view.w < W - 0.5;
    g.addColorStop(0, `rgba(0,0,0,${leftEdge ? a : b})`);
    g.addColorStop(F / view.w, `rgba(0,0,0,${b})`);
    g.addColorStop(1 - F / view.w, `rgba(0,0,0,${b})`);
    g.addColorStop(1, `rgba(0,0,0,${rightEdge ? a : b})`);
    return g;
  }

  function resize() {
    dpr = CAPTURE ? +params.get('dpr') || 1 : Math.min(window.devicePixelRatio || 1, 2);
    const cw = CAPTURE ? +params.get('w') || innerWidth : innerWidth;
    const ch = CAPTURE ? +params.get('h') || innerHeight : innerHeight;
    W = canvas.width = Math.round(cw * dpr);
    H = canvas.height = Math.round(ch * dpr);
    if (CAPTURE) { canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px'; }
    view = computeView();
    ctx.imageSmoothingQuality = 'high';

    // Static base: blurred backdrop + sharp poster feathered into it.
    base = mk(W, H);
    const b = base.getContext('2d');
    // Stretch the poster's outer columns/rows outward so the fill continues its edges.
    // Fill the sides with a blurred mirror of the poster's edges so it continues naturally.
    b.filter = `blur(${Math.round(28 * dpr)}px) brightness(1.03)`;
    const lw = view.ox + 60 * dpr, rw = W - view.ox - view.w + 60 * dpr;
    if (lw > 60 * dpr) { b.save(); b.translate(view.ox, 0); b.scale(-1, 1); b.drawImage(img, 0, 0, lw / view.s, IH, 0, view.oy, lw, view.h); b.restore(); }
    if (rw > 60 * dpr) { b.save(); b.translate(view.ox + view.w, 0); b.scale(-1, 1); const fw = Math.min(rw / view.s, 70); b.drawImage(img, IW - fw, 0, fw, IH, -rw, view.oy, rw, view.h); b.restore(); }
    b.filter = 'none';
    const sharp = mk(W, H), sc = sharp.getContext('2d');
    sc.imageSmoothingQuality = 'high';
    sc.drawImage(img, view.ox, view.oy, view.w, view.h);
    sc.globalCompositeOperation = 'destination-in';
    sc.fillStyle = featherGrad(sc, false); sc.fillRect(0, 0, W, H);
    b.drawImage(sharp, 0, 0);

    // Rain mask: sky inside the poster, everything outside it.
    rainMask = mk(W, H);
    const m = rainMask.getContext('2d');
    m.drawImage(bgmask, view.ox, view.oy, view.w, view.h);
    m.globalCompositeOperation = 'destination-in';
    m.fillStyle = featherGrad(m, false); m.fillRect(0, 0, W, H);
    m.globalCompositeOperation = 'destination-over';
    m.fillStyle = featherGrad(m, true); m.fillRect(0, 0, W, H);
    m.fillRect(0, 0, W, view.oy); m.fillRect(0, view.oy + view.h, W, H);

    rainLayer = mk(W, H);
    hairLayer = mk(W, H); hairLayer.getContext('2d').imageSmoothingQuality = 'high';
    initRain();
  }

  // ---------- background rain ----------
  let streaks = [], bokeh = [], front = [];
  const WIND = -0.12; // horizontal drift per unit of fall
  function newStreak(layer, anywhere) {
    const depth = [0.45, 0.75, 1.0][layer];
    return {
      x: rr(-0.1, 1.1) * W, y: anywhere ? rr(-0.1, 1) * H : rr(-0.3, -0.02) * H,
      v: (900 + rnd() * 500) * depth * dpr, len: (14 + rnd() * 26) * depth * dpr,
      w: (0.6 + layer * 0.45) * dpr, a: [0.2, 0.3, 0.42][layer] * rr(0.6, 1), layer,
    };
  }
  function initRain() {
    const area = (W * H) / (dpr * dpr) / (1920 * 1080);
    const n = Math.round(360 * Math.max(0.5, area));
    streaks = Array.from({ length: n }, (_, i) => newStreak(i % 3, true));
    bokeh = Array.from({ length: Math.round(22 * Math.max(0.6, area)) }, () => newBokeh(true));
    front = Array.from({ length: Math.round(26 * Math.max(0.5, area)) }, () => newFront(true));
    bokehSprite = mk(64, 64);
    const g = bokehSprite.getContext('2d'), rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    rg.addColorStop(0, 'rgba(90,96,108,0.55)'); rg.addColorStop(0.55, 'rgba(90,96,108,0.35)'); rg.addColorStop(1, 'rgba(90,96,108,0)');
    g.fillStyle = rg; g.fillRect(0, 0, 64, 64);
  }
  function newBokeh(anywhere) {
    return { x: rr(0, W), y: anywhere ? rr(0, H) : -40 * dpr, r: rr(6, 22) * dpr, v: rr(25, 70) * dpr, a: rr(0.25, 0.7), ph: rr(0, 6.28) };
  }
  function newFront(anywhere) {
    return { x: rr(-0.1, 1.1) * W, y: anywhere ? rr(-0.2, 1) * H : rr(-0.4, -0.1) * H, v: rr(1700, 2300) * dpr, len: rr(60, 120) * dpr, w: rr(1.2, 2.2) * dpr, a: rr(0.06, 0.13) };
  }
  function stepRain(dt) {
    for (const s of streaks) { s.y += s.v * dt; s.x += s.v * WIND * dt; if (s.y - s.len > H) Object.assign(s, newStreak(s.layer, false)); }
    for (const b of bokeh) { b.y += b.v * dt; b.x += b.v * WIND * 0.5 * dt; b.ph += dt; if (b.y - b.r > H) Object.assign(b, newBokeh(false)); }
    for (const f of front) { f.y += f.v * dt; f.x += f.v * WIND * dt; if (f.y - f.len > H) Object.assign(f, newFront(false)); }
  }
  function drawRain() {
    const r = rainLayer.getContext('2d');
    r.globalCompositeOperation = 'source-over';
    r.clearRect(0, 0, W, H);
    for (const b of bokeh) {
      r.globalAlpha = b.a * (0.75 + 0.25 * Math.sin(b.ph * 1.3));
      r.drawImage(bokehSprite, b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }
    r.globalAlpha = 1; r.lineCap = 'round';
    for (let layer = 0; layer < 3; layer++) {
      r.lineWidth = (0.6 + layer * 0.45) * dpr;
      r.beginPath();
      for (const s of streaks) if (s.layer === layer) { r.moveTo(s.x, s.y); r.lineTo(s.x - s.len * WIND, s.y - s.len); }
      r.strokeStyle = `rgba(105,115,132,${[0.2, 0.3, 0.42][layer]})`;
      r.stroke();
    }
    r.globalCompositeOperation = 'destination-in';
    r.drawImage(rainMask, 0, 0);
    ctx.drawImage(rainLayer, 0, 0);
  }
  function drawFront() {
    ctx.lineCap = 'round';
    for (const f of front) {
      ctx.strokeStyle = `rgba(225,232,245,${f.a})`; ctx.lineWidth = f.w;
      ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x - f.len * WIND, f.y - f.len); ctx.stroke();
    }
  }

  // ---------- face drops ----------
  const mkPath = (pts, end, every, fast = 1) => {
    let len = 0; const cum = [0];
    for (let i = 1; i < pts.length; i++) { len += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); cum.push(len); }
    return { pts, end, every, fast, len, cum, timer: rr(0.1, 1.5) };
  };
  // Runoff, polylines in image pixels. `end`: 'fall' drips off, 'fade' soaks into
  // the skin, a site name merges into that drip and feeds it. `fast` > 1 for the
  // smooth armor plates, where water barely sticks.
  const CHEEK = [[700,430],[695,480],[688,540],[680,600],[672,660],[662,720],[650,780],[632,830],[612,868],[592,894]];
  const JAW = [[612,560],[604,630],[594,700],[582,770],[567,830],[553,868],[548,884]];
  const NOSE = [[862,520],[878,560],[895,600],[907,632],[912,652]];
  const PATHS = LIGHT ? [
    mkPath(CHEEK, 'jaw', [4, 7]), mkPath(JAW, 'a', [3.5, 6.5]), mkPath(NOSE, 'fall', [6, 10]),
  ] : [
    // face
    mkPath(CHEEK, 'jaw', [1.2, 2.5]),
    mkPath(JAW, 'a', [1.2, 2.4]),
    mkPath([[650,330],[645,420],[640,520],[630,620],[615,720],[600,800],[580,860],[566,889]], 'jaw2', [1.5, 3]),
    mkPath([[760,790],[735,815],[705,845],[670,872],[640,886],[622,892]], 'jaw3', [1.4, 2.8]),
    mkPath([[775,430],[768,470],[758,520],[748,560],[740,600]], 'c1', [1.5, 3]),
    mkPath(NOSE, 'fall', [1.8, 3.5]),
    // armor plates, down to their tips
    mkPath([[392,222],[420,320],[450,410],[470,488]], 'logo', [0.8, 1.8], 2.4),
    mkPath([[505,262],[506,350],[494,430],[472,488]], 'logo', [1, 2.2], 2.4),
    mkPath([[330,80],[385,105],[444,138]], 'crest', [1.2, 2.5], 2.2),
    mkPath([[160,560],[230,600],[290,640],[330,667]], 'spike', [0.7, 1.6], 2.6),
    mkPath([[310,470],[350,560],[394,646]], 'fin', [1, 2.2], 2.4),
    mkPath([[392,902],[422,962],[456,1002],[486,1029]], 'collar', [0.8, 1.8], 2.4),
    mkPath([[382,905],[396,1000],[414,1096]], 'collar2', [0.9, 2], 2.4),
    mkPath([[140,870],[250,950],[350,1030],[430,1120],[456,1158]], 'shoulder', [0.8, 1.8], 2.6),
  ];
  function along(p, d) {
    let i = 1; while (i < p.cum.length - 1 && p.cum[i] < d) i++;
    const t = (d - p.cum[i-1]) / (p.cum[i] - p.cum[i-1] || 1), a = p.pts[i-1], b = p.pts[i];
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, Math.atan2(b[1] - a[1], b[0] - a[0])];
  }

  // The poster's own drips, cut out of scene.png by drips.py: [x, y, w, h] in image pixels.
  const SPRITES = { a: [534, 880, 29, 29], c1: [728, 595, 23, 31], c2: [703, 658, 21, 27], stream: [581, 898, 16, 174] };
  const spr = {};
  // Each site collects water (`feed` per second, plus runoff that merges in), swells,
  // and at `max` lets go: hanging drips fall `drop` pixels, beads slide along `out`,
  // then it re-forms. `hang` sites scale from their top anchor so they sag as they fill.
  const SITES = {
    a:   { sprite: 'a', ax: 548, ay: 883, hang: true, out: 'fall', feed: LIGHT ? 0.09 : 0.25, max: LIGHT ? [1.3, 1.55] : [1.15, 1.35], vol: 1, drop: 240 },
    c1:  { sprite: 'c1', ax: 739, ay: 610, out: mkPath([[739,610],[733,622],[727,636],[721,650],[713,671]], 'c2'), feed: LIGHT ? 0.08 : 0.15, max: LIGHT ? [1.15, 1.35] : [1.1, 1.3], vol: 1 },
    c2:  { sprite: 'c2', ax: 713, ay: 671, out: mkPath([[713,671],[709,684],[704,698]], 'fade'), feed: LIGHT ? 0.02 : 0.05, max: LIGHT ? [1.5, 1.8] : [1.3, 1.6], vol: 1 },
  };
  // Lens-drop drip points: [name, x, y, bead radius, fill/s, fall distance, splashes on armor]
  for (const [name, ax, ay, r, feed, drop, splash] of LIGHT ? [['jaw', 590, 897, 3.2, 0.5, 240]] : [
    ['jaw', 590, 897, 3.4, 1.6, 240], ['jaw2', 565, 891, 2.8, 0.8, 240], ['jaw3', 622, 892, 3.0, 1.0, 240], ['jaw4', 645, 879, 2.6, 0.6, 250],
    ['logo', 470, 490, 5.0, 1.0, 180, 1], ['crest', 445, 140, 4.6, 0.8, 230, 1], ['spike', 330, 668, 5.4, 1.2, 260, 1], ['fin', 395, 648, 4.6, 1.0, 200, 1],
    ['collar', 487, 1030, 4.8, 1.1, 260, 1], ['collar2', 415, 1098, 5.0, 1.1, 220, 1], ['shoulder', 458, 1160, 4.8, 0.9, 300, 1],
    ['hair1', 918, 745, 3.4, 0.8, 420], ['hair2', 954, 650, 3.0, 0.7, 480], ['hair3', 947, 850, 3.0, 0.6, 380], ['hair4', 965, 590, 3.0, 0.6, 500],
  ]) SITES[name] = { ax, ay, r, hang: true, out: 'fall', feed, max: LIGHT ? [0.9, 1.2] : [0.6, 1], vol: rr(0, 0.6), drop, splash };
  for (const s of Object.values(SITES)) s.limit = rr(...s.max);
  const siteScale = (s, vol) => s.hang ? [Math.pow(vol, 0.35), Math.pow(vol, 0.6)] : [Math.pow(vol, 0.4), Math.pow(vol, 0.55)];
  // Streams pouring off the chin, the main plate tips and the wettest hair: [x, y, drops/s, droplet size, fall distance, splashes]
  const POURS = (LIGHT ? [] : [[590, 899, 24, 1.3, 240], [470, 494, 16, 2, 180, 1], [330, 672, 18, 2.2, 260, 1], [414, 1102, 14, 2, 220, 1], [487, 1034, 10, 1.8, 260, 1], [395, 650, 8, 1.8, 200, 1], [918, 749, 6, 1.2, 420]])
    .map(([x, y, rate, size, drop, splash]) => ({ x, y, rate, size, drop, splash, acc: 0 }));
  let bits = []; // stream droplets and splash spray: {x, y, vx, vy, r, yEnd, life, splash}
  // Light catching water as it runs down the painted tear streak and the armor plates,
  // feeding the drip at the bottom of each.
  const RUNNELS = [
    { path: mkPath([[796,477],[788,495],[780,520],[770,548],[760,575],[748,596],[741,606]], 'c1'), every: LIGHT ? [1.5, 4] : [0.8, 2], v: [55, 90], size: 1 },
    ...(LIGHT ? [] : PATHS.filter(p => p.fast > 1).map(p => ({ path: p, every: [0.25, 0.9], v: [260, 420], size: 1.7 }))),
  ];
  for (const r of RUNNELS) r.timer = rr(0, 1);
  let runnels = [];

  let drops = [];
  const trails = []; // {x, y, r, a, age}
  function spawnDrop(p) {
    drops.push({ p, d: 0, r: p.fast > 1 ? rr(4.6, 6.6) : rr(3.6, 5.4), state: 'slide', pause: rr(0.2, 0.6) / p.fast, run: 0, speed: 0, x: p.pts[0][0], y: p.pts[0][1], ang: Math.PI / 2, vy: 0, life: 1, hang: 0, grow: 0, wob: rr(0, 6.28), yEnd: p.pts[p.pts.length - 1][1] + 240 });
  }
  function splash(x, y, n) {
    for (let i = 0; i < n; i++) bits.push({ x, y, vx: rr(-90, 90), vy: rr(-220, -60), r: rr(0.6, 1.3), yEnd: y + 40, life: rr(0.25, 0.45), spray: true });
  }
  function release(s) {
    const [scx, scy] = siteScale(s, s.vol);
    const d = { p: null, d: 0, r: s.r ? s.r * scx : 4, sprite: s.sprite, site: s, sc: [scx, scy], state: 'fall', pause: rr(0.1, 0.4), run: rr(10, 25), speed: 0,
      x: s.ax, y: s.ay + (s.r ? s.r * scy : 0), ang: Math.PI / 2, vy: 20, life: 1, hang: 0, grow: 0, wob: rr(0, 6.28), yEnd: s.ay + (s.drop || 240), splash: s.splash };
    if (s.out !== 'fall') { d.p = s.out; d.state = 'slide'; }
    drops.push(d);
    s.vol = 0.08; s.limit = rr(...s.max);
  }
  function stepDrops(dt) {
    for (const p of PATHS) {
      p.timer -= dt;
      if (p.timer <= 0) { if (drops.filter(d => d.p === p).length < (LIGHT ? 2 : 3)) spawnDrop(p); p.timer = rr(...p.every); }
    }
    for (const s of Object.values(SITES)) {
      s.vol += s.feed * dt;
      if (s.vol >= s.limit) release(s);
    }
    for (const p of POURS) {
      p.acc += p.rate * dt;
      while (p.acc >= 1) { p.acc--; bits.push({ x: p.x + rr(-1.2, 1.2), y: p.y + rr(0, 30), vx: rr(-6, 6), vy: rr(80, 260), r: p.size * rr(0.55, 1.25), yEnd: p.y + p.drop * rr(0.85, 1.1), life: 1, splash: p.splash }); }
    }
    for (const b of bits) {
      b.vy += 1400 * dt; b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.spray) b.life -= dt;
      else if (b.y >= b.yEnd) { b.life = 0; if (b.splash && rnd() < 0.3) splash(b.x, b.yEnd, 1); }
    }
    bits = bits.filter(b => b.life > 0);
    for (const R of RUNNELS) {
      R.timer -= dt;
      if (R.timer <= 0) { runnels.push({ R, d: 0, v: rr(...R.v) }); R.timer = rr(...R.every); }
    }
    for (const r of runnels) { r.d += r.v * dt; if (r.d >= r.R.path.len) SITES[r.R.path.end].vol += 0.06; }
    runnels = runnels.filter(r => r.d < r.R.path.len);
    for (const d of drops) {
      d.wob += dt * 3;
      if (d.state === 'slide') {
        // Stick-slip motion: drops pause, then lurch forward like real water on skin.
        const fast = d.p.fast;
        if (d.pause > 0) { d.pause -= dt; d.r += dt * 0.25; }
        else {
          d.speed = Math.min(d.speed + 260 * fast * dt, 150 * fast);
          const step = d.speed * dt; d.d += step; d.run -= step;
          if (d.run <= 0) { d.pause = rr(0.15, 1.1) / (fast * fast); d.run = rr(25, 90) * fast; d.speed = rr(10, 40) * fast; }
          d.r = Math.max(2.6, d.r - step * 0.004);
          trails.push({ x: d.x, y: d.y, r: d.sprite ? 3 : d.r, a: fast > 1 ? 0.32 : 0.16, age: 0 });
        }
        if (d.d >= d.p.len) {
          d.d = d.p.len;
          const into = SITES[d.p.end];
          if (into) { into.vol += d.sprite ? 0.45 : 0.3; d.life = 0; }
          else { d.state = d.p.end === 'fall' ? 'hang' : 'fade'; d.hang = rr(0.6, 1.6); }
        }
        [d.x, d.y, d.ang] = along(d.p, d.d);
      } else if (d.state === 'hang') {
        d.hang -= dt; d.grow = Math.min(1, d.grow + dt * 0.8);
        if (d.hang <= 0) { d.state = 'fall'; d.vy = 30; }
      } else if (d.state === 'fall') {
        d.vy += 1400 * dt; d.y += d.vy * dt; d.ang = Math.PI / 2;
        if (d.y > d.yEnd) {
          if (d.splash && d.life === 1) splash(d.x, d.y, 4);
          d.life -= dt * (d.splash ? 12 : 5);
        }
      } else if (d.state === 'fade') {
        d.life -= dt * 0.7; d.r *= 1 - dt * 0.3;
        if (d.sprite) { d.sc[0] *= 1 - dt * 0.3; d.sc[1] *= 1 - dt * 0.3; }
      }
    }
    drops = drops.filter(d => d.life > 0 && d.y < 1700);
    for (const t of trails) t.age += dt;
    while (trails.length && trails[0].age > 2.2) trails.shift();
  }

  // Draws a cut-out drip with its anchor point (ax, ay) placed at (x, y), image coords.
  function drawSprite(key, ax, ay, x, y, scx, scy, alpha) {
    const [rx, ry, w, h] = SPRITES[key];
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
    ctx.drawImage(spr[key], sx(x - (ax - rx) * scx), sy(y - (ay - ry) * scy), w * scx * view.s, h * scy * view.s);
    ctx.globalAlpha = 1;
  }
  // Procedural drop: a tiny inverted lens over the scene, centred at (x, y) image coords.
  function drawLens(x, y, rad, ang, stretch, wob, alpha) {
    const r = rad * view.s;
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
    ctx.translate(sx(x), sy(y)); ctx.rotate(ang - Math.PI / 2);
    ctx.scale(1 + Math.sin(wob) * 0.04, stretch);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.283); ctx.clip();
    ctx.save(); ctx.scale(-1, -1);
    const k = 3.2;
    ctx.drawImage(img, x - rad * k, y - rad * k, rad * k * 2, rad * k * 2, -r * 1.05, -r * 1.05, r * 2.1, r * 2.1);
    ctx.restore();
    const sh = ctx.createRadialGradient(-r * 0.25, -r * 0.3, r * 0.1, 0, 0, r);
    sh.addColorStop(0, 'rgba(255,255,255,0.05)'); sh.addColorStop(0.7, 'rgba(40,40,50,0.08)'); sh.addColorStop(1, 'rgba(20,20,30,0.45)');
    ctx.fillStyle = sh; ctx.fillRect(-r, -r, r * 2, r * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.4, r * 0.28, r * 0.18, -0.6, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(r * 0.2, r * 0.55, r * 0.35, r * 0.12, 0, 0, 6.283); ctx.fill();
    ctx.restore();
  }
  // The painted trickle under the chin, scrolled downward so it flows.
  let streamBuf, streamFade;
  function drawStream(time) {
    const [x, y, w, h] = SPRITES.stream, g = streamBuf.getContext('2d');
    g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, w, h);
    const o = (time * (LIGHT ? 140 : 240)) % h;
    g.drawImage(spr.stream, 0, o); g.drawImage(spr.stream, 0, o - h);
    g.globalCompositeOperation = 'destination-in'; g.fillStyle = streamFade; g.fillRect(0, 0, w, h);
    ctx.drawImage(streamBuf, sx(x), sy(y), w * view.s, h * view.s);
  }
  // Stream droplets and spray as short motion-blurred streaks: a dark edge reads on the
  // white sky, a bright core reads on the dark armor.
  function drawBits() {
    const s = view.s;
    ctx.lineCap = 'round';
    for (const [style, wide] of [['rgba(55,60,72,0.3)', 2], ['rgba(255,255,255,0.9)', 0.9]]) {
      ctx.strokeStyle = style;
      for (const b of bits) {
        const len = Math.min(34, Math.max(2, b.vy * 0.026)), a = b.spray ? Math.max(0, b.life * 2.5) : 1;
        if (a <= 0) continue;
        ctx.globalAlpha = a;
        ctx.lineWidth = b.r * wide * s;
        ctx.beginPath(); ctx.moveTo(sx(b.x - b.vx * 0.02), sy(b.y - len)); ctx.lineTo(sx(b.x), sy(b.y)); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }
  function drawDrops(time) {
    const s = view.s;
    drawStream(time);
    // Wet trails left behind on the skin.
    for (const t of trails) {
      const a = t.a * (1 - t.age / 2.2);
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.beginPath(); ctx.arc(sx(t.x), sy(t.y), t.r * 0.45 * s, 0, 6.283); ctx.fill();
    }
    for (const r of runnels) {
      const z = r.R.size;
      for (let i = 0; i < 6; i++) {
        const [x, y] = along(r.R.path, Math.max(0, r.d - i * 3 * z));
        ctx.fillStyle = `rgba(255,255,255,${0.75 * (1 - i / 6)})`;
        ctx.beginPath(); ctx.arc(sx(x), sy(y), (1.3 - i * 0.12) * z * s, 0, 6.283); ctx.fill();
      }
    }
    drawBits();
    for (const site of Object.values(SITES)) {
      const wob = site.vol > 1 ? 1 + Math.sin(time * 9 + site.ax) * 0.03 * (site.vol - 1) : 1;
      const [scx, scy] = siteScale(site, site.vol);
      if (site.sprite) drawSprite(site.sprite, site.ax, site.ay, site.ax, site.ay, scx * wob, scy / wob, 1);
      else drawLens(site.ax, site.ay + site.r * scy, site.r * scx, Math.PI / 2, scy / scx * wob, 0, Math.min(1, site.vol * 3));
    }
    for (const d of drops) {
      if (d.sprite) {
        const st = d.state === 'fall' ? 1 + Math.min(0.9, d.vy / 900) : 1;
        drawSprite(d.sprite, d.site.ax, d.site.ay, d.x, d.y, d.sc[0] / Math.sqrt(st), d.sc[1] * st, d.life);
        continue;
      }
      const swell = 1 + d.grow * 0.45;
      const stretch = d.state === 'fall' ? 1 + Math.min(1.6, d.vy / 600) : (d.state === 'hang' ? 1 + d.grow * 0.35 : 1.18);
      drawLens(d.x, d.y, d.r * swell, d.ang, stretch, d.wob, d.life);
    }
  }

  // ---------- glints & glow ----------
  const GLINTS = [[783,620],[742,615],[565,895],[600,900],[715,355],[690,640],[828,465],[540,930]].map(([x, y]) => ({ x, y, t: rr(0, 6), period: rr(4, 9) }));
  function drawGlints(time) {
    for (const g of GLINTS) {
      const ph = ((time + g.t) % g.period) / 0.6;
      if (ph > 1) continue;
      const a = Math.sin(ph * Math.PI), x = sx(g.x), y = sy(g.y), L = 9 * view.s * (0.5 + a);
      ctx.strokeStyle = `rgba(255,255,255,${0.85 * a})`; ctx.lineWidth = Math.max(1, view.s);
      ctx.beginPath(); ctx.moveTo(x - L, y); ctx.lineTo(x + L, y); ctx.moveTo(x, y - L); ctx.lineTo(x, y + L); ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.beginPath(); ctx.arc(x, y, 1.6 * view.s, 0, 6.283); ctx.fill();
    }
  }
  function drawGlow(time) {
    const pulse = 0.5 + 0.5 * Math.sin(time * 1.6) * Math.sin(time * 0.37 + 1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.25 + 0.45 * pulse;
    ctx.drawImage(glowBlur, view.ox, view.oy, view.w, view.h);
    ctx.globalAlpha = 0.15 + 0.3 * pulse;
    ctx.drawImage(glow, view.ox, view.oy, view.w, view.h);
    ctx.restore();
  }

  // ---------- hair in the wind ----------
  // A WebGL pass redraws the poster with the hair warped by a gusting wind that blows
  // to the left, like the rain. hair_amp.png (tools/hair.py) says how far each pixel
  // may move: the loose strands against the sky most, her face not at all. Every
  // frequency divides 12 s, so the sway loops with the videos. Without WebGL (or
  // where the browser won't read local files into it) the hair simply stays still.
  const HAIR_AMP = 7; // poster pixels of sway at the loosest strand tips
  const HAIR_FRAG = `
    precision highp float;
    uniform sampler2D img, amp;
    uniform vec2 size;
    uniform float t;
    varying vec2 uv;
    const float TAU = 6.2831853;
    void main() {
      vec2 p = uv * size;
      float a = texture2D(amp, uv).r * ${HAIR_AMP.toFixed(1)};
      // Gusts on 12 s and 6 s cycles, a sway travelling down the strands, a quick flutter.
      float gust = 0.55 + 0.3 * sin(TAU * t / 12.0 + 0.6) + 0.15 * sin(TAU * t / 6.0 + 2.1);
      float sway = sin(TAU * t * 5.0 / 12.0 - p.y * 0.03 + p.x * 0.012);
      float flutter = sin(TAU * t * 13.0 / 12.0 - p.y * 0.085 + p.x * 0.02);
      vec2 d = a * vec2(-0.7 * gust + 0.32 * sway + 0.12 * flutter,
                        0.18 * sin(TAU * t * 4.0 / 12.0 - p.x * 0.02 + 1.3) - 0.12 * gust);
      gl_FragColor = texture2D(img, (p - d) / size);
    }`;
  let hair = null;
  function initHair(amp) {
    try {
      const c = mk(IW, IH);
      const gl = c.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
      if (!gl) return;
      const shader = (type, src) => {
        const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
        if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
        return sh;
      };
      const prog = gl.createProgram();
      gl.attachShader(prog, shader(gl.VERTEX_SHADER, 'attribute vec2 p; varying vec2 uv; void main() { uv = vec2(p.x * 0.5 + 0.5, 0.5 - p.y * 0.5); gl_Position = vec4(p, 0.0, 1.0); }'));
      gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, HAIR_FRAG));
      gl.linkProgram(prog); gl.useProgram(prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, 'p');
      gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      [img, amp].forEach((image, unit) => {
        gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      });
      gl.uniform1i(gl.getUniformLocation(prog, 'img'), 0); gl.uniform1i(gl.getUniformLocation(prog, 'amp'), 1);
      gl.uniform2f(gl.getUniformLocation(prog, 'size'), IW, IH);
      gl.viewport(0, 0, IW, IH);
      hair = { c, gl, t: gl.getUniformLocation(prog, 't') };
    } catch (e) { hair = null; }
  }
  // Draws the swaying poster over the base, the same way the base drew the still one.
  function drawHair() {
    if (!hair) return;
    hair.gl.uniform1f(hair.t, time % 12);
    hair.gl.drawArrays(hair.gl.TRIANGLE_STRIP, 0, 4);
    if (view.ox <= 0.5 && view.ox + view.w >= W - 0.5) { ctx.drawImage(hair.c, view.ox, view.oy, view.w, view.h); return; }
    const h = hairLayer.getContext('2d');
    h.globalCompositeOperation = 'source-over'; h.clearRect(0, 0, W, H);
    h.drawImage(hair.c, view.ox, view.oy, view.w, view.h);
    h.globalCompositeOperation = 'destination-in'; h.fillStyle = featherGrad(h, false); h.fillRect(0, 0, W, H);
    ctx.drawImage(hairLayer, 0, 0);
  }

  // ---------- loop ----------
  let time = 0;
  function step(dt) { time += dt; stepRain(dt); stepDrops(dt); }
  function draw() {
    ctx.drawImage(base, 0, 0);
    drawHair();
    drawRain();
    drawGlow(time);
    drawDrops(time);
    drawGlints(time);
    drawFront();
  }

  const names = ['a', 'c1', 'c2', 'stream'];
  Promise.all([load('scene.png'), load('bgmask.png'), load('glow.png'), load('hair_amp.png'), ...names.map(n => load(`drip_${n}.png`))]).then(([a, b, c, amp, ...d]) => {
    img = a; bgmask = b; glow = c;
    initHair(amp);
    names.forEach((n, i) => { spr[n] = d[i]; });
    const [, , sw, sh] = SPRITES.stream;
    streamBuf = mk(sw, sh);
    streamFade = streamBuf.getContext('2d').createLinearGradient(0, 0, 0, sh);
    streamFade.addColorStop(0, 'rgba(0,0,0,0)'); streamFade.addColorStop(0.04, '#000'); streamFade.addColorStop(0.8, '#000'); streamFade.addColorStop(1, 'rgba(0,0,0,0)');
    glowBlur = mk(IW, IH);
    const g = glowBlur.getContext('2d'); g.filter = 'blur(10px)'; g.drawImage(glow, 0, 0); g.drawImage(glow, 0, 0);
    resize();
    for (let i = 0; i < 90; i++) step(1 / 30); // warm up so drops are already on her face
    if (CAPTURE) { window.wp = { step, draw, canvas, hairOn: !!hair }; draw(); window.wpReady = true; return; }
    addEventListener('resize', resize);
    let last = performance.now();
    const frame = now => {
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      step(dt); draw(); requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
